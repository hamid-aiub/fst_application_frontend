name: fst-frontend

services:
  web:
    image: ${APP_IMAGE:-fst-frontend:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5001}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_BASE_URL: ${API_BASE_URL:-http://api:5001}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aiub-infrastructure

networks:
  aiub-infrastructure:
    external: true
    name: aiub-infrastructure
